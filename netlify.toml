# EECOH Codex — Netlify configuration
# Single self-contained index.html at the repo root + one serverless function.

[build]
  publish = "."
  # THE DEPLOY GATE: the full regression suite IS the build.
  # If any test fails, the build fails and the previous deploy stays live.
  command = "node codex-harness.js"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Optional clean URL: /api/ai -> the function. The app calls the function
# path directly, so this is just a convenience.
[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200
